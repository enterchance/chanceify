name: Windows build check

# Compiles chanceify on Windows for every push, so a version that does not
# build is caught before it reaches the PC. Checks only (no exe made).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-windows
      # The errors go into an annotation too, so they can be read without
      # downloading the log.
      - name: Check
        shell: bash
        run: |
          set -o pipefail
          if ! cargo check --locked --profile fast --features lights-feed 2>&1 | tee check.log; then
            { grep -E -A12 '^(error|warning: unused)' check.log || tail -60 check.log; } | head -150 > err.txt
            msg=$(tr -d '\r' < err.txt | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=build failed::$msg"
            exit 1
          fi
