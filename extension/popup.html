<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>chanceify</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><img src="icons/96.png" alt=""><div><h1>chanceify</h1><p>for Last.fm</p></div></header>
<label class="row"><span>replace last.fm play buttons<small>songs go to chanceify instead</small></span><input type="checkbox" id="replace"><i></i></label>
<label class="row"><span>show a small note when sent<small>"playing in chanceify"</small></span><input type="checkbox" id="toast"><i></i></label>
<section>
<h2>how it works</h2>
<ul>
<li>click the purple button to play a song</li>
<li>shift-click or right-click to add it to the queue</li>
</ul>
</section>
<section>
<h2>first time only</h2>
<p>in chanceify, open settings and press <b>let chanceify:// links open chanceify</b>. your browser will ask once; tick always allow.</p>
</section>
<a class="test" href="chanceify://play?artist=Daft%20Punk&amp;track=One%20More%20Time">test the link</a>
<script src="popup.js"></script>
</body></html>
